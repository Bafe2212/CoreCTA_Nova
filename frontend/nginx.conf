# NOVA Frontend — nginx-Config
# Liefert den Vite-Production-Build aus und proxyt /api/* zum Backend-Container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle Routen an index.html (React Router übernimmt clientseitig)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* an das Backend weiterleiten (Docker-Service-Name "backend")
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-Streaming (Chat) braucht deaktivierte Pufferung + langes Timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Statische Assets aggressiv cachen (Vite hashet die Dateinamen)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
